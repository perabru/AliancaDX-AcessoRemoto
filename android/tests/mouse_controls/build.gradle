plugins {
    id 'org.jetbrains.kotlin.jvm' version '2.1.20'
}

import org.gradle.api.artifacts.transform.TransformAction
import org.gradle.api.artifacts.transform.TransformParameters
import org.gradle.api.artifacts.transform.TransformOutputs
import org.gradle.api.artifacts.transform.InputArtifact
import org.gradle.api.artifacts.type.ArtifactTypeDefinition
import org.gradle.api.file.FileSystemLocation
import org.gradle.api.provider.Provider

// The isolated JVM harness has no Android Gradle Plugin to unpack AndroidX AARs.
abstract class AarClasses implements TransformAction<TransformParameters.None> {
    @InputArtifact abstract Provider<FileSystemLocation> getInputArtifact()
    void transform(TransformOutputs outputs) {
        File source = inputArtifact.get().asFile
        File target = outputs.file(source.name.replace('.aar','-classes.jar'))
        new java.util.zip.ZipFile(source).withCloseable { zip ->
            def entry = zip.getEntry('classes.jar')
            if (entry == null) throw new GradleException('Missing classes.jar in '+source.name)
            target.withOutputStream { output -> zip.getInputStream(entry).withCloseable { input -> output << input } }
        }
    }
}

dependencies {
    registerTransform(AarClasses) {
        from.attribute(ArtifactTypeDefinition.ARTIFACT_TYPE_ATTRIBUTE,'aar')
        to.attribute(ArtifactTypeDefinition.ARTIFACT_TYPE_ATTRIBUTE,'jar')
    }
}
configurations.configureEach {
    if (name in ['compileClasspath','testCompileClasspath','testRuntimeClasspath']) {
        attributes.attribute(ArtifactTypeDefinition.ARTIFACT_TYPE_ATTRIBUTE,'jar')
    }
}

repositories { mavenCentral(); google() }

dependencies {
    compileOnly 'org.robolectric:android-all:15-robolectric-12650502'
    testImplementation 'org.robolectric:android-all:15-robolectric-12650502'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}

kotlin {
    jvmToolchain(17)
    // Compile the exact production components; never maintain copies in the fixture.
    sourceSets.main.kotlin {
        srcDirs('../../app/src/main/java')
        include('br/com/perabru/minianydesk/MouseControlButton.kt')
        include('br/com/perabru/minianydesk/FullscreenCommandsBar.kt')
        include('br/com/perabru/minianydesk/SessionPresentation.kt')
        include('br/com/perabru/minianydesk/MeshCodeVault.kt')
        include('br/com/perabru/minianydesk/MeshPairing.kt')
        include('br/com/perabru/minianydesk/UiKit.kt')
        include('br/com/perabru/minianydesk/UiIconDrawable.kt')
    }
}

test {
    doFirst { file('output').mkdirs(); file('output640').mkdirs() }
    maxParallelForks = 1
    maxHeapSize = '768m'
    systemProperty 'robolectric.graphicsMode', 'NATIVE'
    systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
    ['http.proxyHost','http.proxyPort','http.nonProxyHosts',
     'https.proxyHost','https.proxyPort','https.nonProxyHosts'].each { key ->
        if (System.getProperty(key)) systemProperty(key,System.getProperty(key))
    }
    jvmArgs '--add-opens=java.base/java.lang=ALL-UNNAMED',
        '--add-opens=java.base/java.util=ALL-UNNAMED',
        '--add-opens=java.base/java.io=ALL-UNNAMED',
        '--add-opens=java.base/java.net=ALL-UNNAMED',
        '--add-opens=java.base/java.security=ALL-UNNAMED',
        '--add-opens=java.base/java.text=ALL-UNNAMED',
        '--add-opens=java.base/jdk.internal.access=ALL-UNNAMED',
        '--add-opens=java.desktop/java.awt.font=ALL-UNNAMED'
    testLogging { events 'passed', 'skipped', 'failed'; exceptionFormat 'full' }
}
