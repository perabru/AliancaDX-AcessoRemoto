plugins {
    id 'org.jetbrains.kotlin.jvm' version '2.1.20'
}

import org.gradle.api.artifacts.transform.TransformAction
import org.gradle.api.artifacts.transform.TransformParameters
import org.gradle.api.artifacts.transform.TransformOutputs
import org.gradle.api.artifacts.transform.InputArtifact
import org.gradle.api.artifacts.type.ArtifactTypeDefinition
import org.gradle.api.file.FileSystemLocation
import org.gradle.api.provider.Provider

// The isolated JVM harness has no Android Gradle Plugin to unpack AndroidX AARs.
abstract class AarClasses implements TransformAction<TransformParameters.None> {
    @InputArtifact abstract Provider<FileSystemLocation> getInputArtifact()
    void transform(TransformOutputs outputs) {
        File source = inputArtifact.get().asFile
        File target = outputs.file(source.name.replace('.aar','-classes.jar'))
        new java.util.zip.ZipFile(source).withCloseable { zip ->
            def entry = zip.getEntry('classes.jar')
            if (entry == null) throw new GradleException('Missing classes.jar in '+source.name)
            target.withOutputStream { output -> zip.getInputStream(entry).withCloseable { input -> output << input } }
        }
    }
}

dependencies {
    registerTransform(AarClasses) {
        from.attribute(ArtifactTypeDefinition.ARTIFACT_TYPE_ATTRIBUTE,'aar')
        to.attribute(ArtifactTypeDefinition.ARTIFACT_TYPE_ATTRIBUTE,'jar')
    }
}
configurations.configureEach {
    if (name in ['compileClasspath','testCompileClasspath','testRuntimeClasspath']) {
        attributes.attribute(ArtifactTypeDefinition.ARTIFACT_TYPE_ATTRIBUTE,'jar')
    }
}

repositories { mavenCentral(); google() }

def sdkDirectory = System.getenv('ANDROID_HOME') ?: System.getenv('ANDROID_SDK_ROOT')
if (!sdkDirectory) {
    def properties = new Properties()
    file('../../local.properties').withInputStream { properties.load(it) }
    sdkDirectory = properties.getProperty('sdk.dir')
}

dependencies {
    // Compile against the public SDK, rather than android-all's hidden Context.destroy API.
    compileOnly files(new File(sdkDirectory, 'platforms/android-36/android.jar'))
    testImplementation 'org.robolectric:android-all:15-robolectric-12650502'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}

def appSources = file('../../app/src/main/java')
def controllerExcluded = ['HostCaptureService.kt', 'HostRuntime.kt', 'RemoteAccessibilityService.kt', 'AndroidTlsIdentity.kt']
def generated = file("$buildDir/generated/qa-symbols")
def symbols = new File(generated, 'br/com/perabru/minianydesk/BuildSymbols.kt')
tasks.register('qaBuildSymbols') {
    inputs.dir(appSources)
    inputs.file('../../app/build.gradle.kts')
    outputs.file(symbols)
    doLast {
        def resources = [:].withDefault { [] as Set }
        fileTree(appSources).matching { include '**/*.kt'; controllerExcluded.each { exclude '**/'+it } }.each { source ->
            (source.text =~ /(?<![\w.])R\.(\w+)\.(\w+)/).each { match -> resources[match[1]].add(match[2]) }
        }
        def config = file('../../app/build.gradle.kts').text
        def version = (config =~ /versionName\s*=\s*"([^"]+)"/)[0][1]
        def versionCode = (config =~ /versionCode\s*=\s*(\d+)/)[0][1]
        def lines = ['package br.com.perabru.minianydesk', 'object BuildConfig {',
            ' const val DEFAULT_ROLE = "controller"', ' const val VERSION_NAME = "'+version+'"',
            ' const val APPLICATION_ID = "br.com.perabru.minianydesk.controlador"',
            ' const val VERSION_CODE = '+versionCode, ' const val DEBUG = false', '}', 'object R {']
        resources.sort().each { kind, names ->
            lines << ' object '+kind+' {'
            names.sort().each { name -> lines << '  const val '+name+' = 0' }
            lines << ' }'
        }
        lines << ' }'
        symbols.parentFile.mkdirs(); symbols.text = lines.join('\n')+'\n'
    }
}
kotlin {
    jvmToolchain(17)
    sourceSets.main.kotlin {
        srcDirs(appSources, generated)
        controllerExcluded.each { exclude '**/'+it }
    }
}
tasks.named('compileKotlin').configure { dependsOn 'qaBuildSymbols' }

test {
    doFirst { file('output').mkdirs(); file('output640').mkdirs() }
    maxParallelForks = 1
    maxHeapSize = '768m'
    systemProperty 'robolectric.graphicsMode', 'NATIVE'
    systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
    ['http.proxyHost','http.proxyPort','http.nonProxyHosts',
     'https.proxyHost','https.proxyPort','https.nonProxyHosts'].each { key ->
        if (System.getProperty(key)) systemProperty(key,System.getProperty(key))
    }
    jvmArgs '--add-opens=java.base/java.lang=ALL-UNNAMED',
        '--add-opens=java.base/java.util=ALL-UNNAMED',
        '--add-opens=java.base/java.io=ALL-UNNAMED',
        '--add-opens=java.base/java.net=ALL-UNNAMED',
        '--add-opens=java.base/java.security=ALL-UNNAMED',
        '--add-opens=java.base/java.text=ALL-UNNAMED',
        '--add-opens=java.base/jdk.internal.access=ALL-UNNAMED',
        '--add-opens=java.desktop/java.awt.font=ALL-UNNAMED'
    testLogging { events 'passed', 'skipped', 'failed'; exceptionFormat 'full' }
}
