name: Publicar aplicativos 6.2.1

on:
  push:
    branches: [main]
    paths: [.github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aliancadx-release-6.2.1
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Obter os fontes congelados
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validar os helpers de distribuição
        run: |
          python3 -m unittest discover -s scripts -p 'test_release_*.py' -v
      - name: Obter os dois arquivos públicos e conferir SHA-256
        run: |
          python3 scripts/download_release_inputs.py --output "$RUNNER_TEMP/aliancadx-inputs"
      - name: Reconstruir e conferir os aplicativos
        run: |
          python3 scripts/build_release.py \
            --input-dir "$RUNNER_TEMP/aliancadx-inputs" \
            --tools-dir "$RUNNER_TEMP/aliancadx-tools" \
            --output-dir "$RUNNER_TEMP/aliancadx-release"
      - name: Guardar os relatórios da compilação
        uses: actions/upload-artifact@v4
        with:
          name: aliancadx-6.2.1-verification
          path: |
            ${{ runner.temp }}/aliancadx-release/*.json
            ${{ runner.temp }}/aliancadx-release/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publicar o release completo
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: v6.2.1
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "O release já existe. Os arquivos publicados não serão sobrescritos."
            exit 1
          fi
          existing_tag=$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG")
          if [[ -n "$existing_tag" ]]; then
            echo "A tag já existe. A publicação foi interrompida sem alterar a tag."
            exit 1
          fi
          remote_head=$(git ls-remote origin refs/heads/main | cut -f1)
          if [[ "$remote_head" != "$GITHUB_SHA" ]]; then
            echo "main mudou durante a compilação. Nenhuma revisão será sobrescrita."
            exit 1
          fi
          python3 scripts/build_release.py \
            --output-dir "$RUNNER_TEMP/aliancadx-release" --record-github-pins
          git add -- desktop/docs/RELATORIO_INSTALADORES_GITHUB_6_2_1.json \
            desktop/installer/release_artifacts_6_2_1.json
          python3 - <<'PY'
          import subprocess
          staged = set(subprocess.check_output(["git", "diff", "--cached", "--name-only"], text=True).splitlines())
          assert staged == {"desktop/docs/RELATORIO_INSTALADORES_GITHUB_6_2_1.json", "desktop/installer/release_artifacts_6_2_1.json"}, "Unexpected staged release files"
          PY
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'Record verified GitHub release 6.2.1 installer hashes'
          git -c credential.helper= \
            -c 'credential.helper=!f() { printf "%s\n" "username=x-access-token" "password=$GH_TOKEN"; }; f' \
            push origin HEAD:refs/heads/main
          release_target=$(git rev-parse HEAD)
          cat > "$RUNNER_TEMP/aliancadx-release-notes.md" <<'NOTES'
          Atualização de desempenho do AliançaDX Acesso Remoto.

          - Transmissão adaptativa para conexões lentas, com controle dos quadros pendentes.
          - Tela e movimentos do cursor usam os dados mais recentes para reduzir filas.
          - Retomada da tela ao voltar ao aplicativo Android.

          Atualize o Hospedeiro e o Controlador utilizados na conexão. A latência depende da rede e não pode ser eliminada por completo.

          Os instaladores Windows foram reconstruídos a partir deste commit e conferidos por CRC e pelos hashes dos fontes incluídos. O APK preserva a assinatura de atualização e corresponde exatamente ao arquivo verificado pelo proprietário. SHA256SUMS e relatórios acompanham os downloads.
          NOTES
          assets=("$RUNNER_TEMP/aliancadx-release/"*)
          gh release create "$RELEASE_TAG" "${assets[@]}" \
            --target "$release_target" --draft \
            --title "AliançaDX Acesso Remoto 6.2.1" \
            --notes-file "$RUNNER_TEMP/aliancadx-release-notes.md"
          gh release view "$RELEASE_TAG" \
            --json tagName,targetCommitish,assets > "$RUNNER_TEMP/aliancadx-uploaded-release.json"
          python3 scripts/build_release.py \
            --output-dir "$RUNNER_TEMP/aliancadx-release" \
            --verify-upload "$RUNNER_TEMP/aliancadx-uploaded-release.json" \
            --expected-target "$release_target"
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-parse "${RELEASE_TAG}^{commit}")" = "$release_target"
          gh release edit "$RELEASE_TAG" --draft=false
