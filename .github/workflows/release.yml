name: Publicar aplicativos 6.3.0

on:
  push:
    branches: [main]
    paths: [.github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aliancadx-release-6.3.0
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Obter os fontes congelados
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validar os helpers de distribuição
        run: |
          python3 -m unittest discover -s scripts -p 'test_release_*.py' -v
      - name: Obter a base Windows pública e conferir SHA-256
        run: |
          python3 scripts/download_release_inputs.py --only controller --output "$RUNNER_TEMP/aliancadx-inputs"
      - name: Reconstruir e conferir os aplicativos
        run: |
          python3 scripts/build_release.py \
            --input-dir "$RUNNER_TEMP/aliancadx-inputs" \
            --tools-dir "$RUNNER_TEMP/aliancadx-tools" \
            --output-dir "$RUNNER_TEMP/aliancadx-release"
      - name: Guardar os relatórios da compilação
        uses: actions/upload-artifact@v4
        with:
          name: aliancadx-6.3.0-verification
          path: |
            ${{ runner.temp }}/aliancadx-release/*.json
            ${{ runner.temp }}/aliancadx-release/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publicar o release completo
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: v6.3.0
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "O release já existe. Os arquivos publicados não serão sobrescritos."
            exit 1
          fi
          existing_tag=$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG")
          if [[ -n "$existing_tag" ]]; then
            echo "A tag já existe. A publicação foi interrompida sem alterar a tag."
            exit 1
          fi
          remote_head=$(git ls-remote origin refs/heads/main | cut -f1)
          if [[ "$remote_head" != "$GITHUB_SHA" ]]; then
            echo "main mudou durante a compilação. Nenhuma revisão será sobrescrita."
            exit 1
          fi
          python3 scripts/build_release.py \
            --output-dir "$RUNNER_TEMP/aliancadx-release" --record-github-pins
          git add -- desktop/docs/RELATORIO_INSTALADORES_GITHUB_6_3_0.json \
            desktop/installer/release_artifacts_6_3_0.json
          python3 - <<'PY'
          import subprocess
          staged = set(subprocess.check_output(["git", "diff", "--cached", "--name-only"], text=True).splitlines())
          assert staged == {"desktop/docs/RELATORIO_INSTALADORES_GITHUB_6_3_0.json", "desktop/installer/release_artifacts_6_3_0.json"}, "Unexpected staged release files"
          PY
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'Record verified GitHub release 6.3.0 installer hashes'
          git -c credential.helper= \
            -c 'credential.helper=!f() { printf "%s\n" "username=x-access-token" "password=$GH_TOKEN"; }; f' \
            push origin HEAD:refs/heads/main
          release_target=$(git rev-parse HEAD)
          cat > "$RUNNER_TEMP/aliancadx-release-notes.md" <<'NOTES'
          AliançaDX Acesso Remoto 6.3.0 para Windows e iOS PWA.

          - Conector iOS no Windows e aplicativo web instalável para iPhone/iPad.
          - Código do PWA incluído nos instaladores e no ZIP de distribuição.
          - As sessões Windows/Android continuam usando a autorização do Hospedeiro.

          O Android permanece na versão 6.2.2, publicada separadamente. O PWA não é um aplicativo nativo da App Store e requer o conector Windows.

          Os dois instaladores foram reconstruídos a partir deste commit, conferidos por CRC e pelos hashes dos fontes incorporados. O ZIP do PWA contém exatamente os arquivos de navegador incluídos nos instaladores. SHA256SUMS e relatórios acompanham os downloads. Não se declara teste em iPhone ou Windows físicos.
          NOTES
          assets=("$RUNNER_TEMP/aliancadx-release/"*)
          gh release create "$RELEASE_TAG" "${assets[@]}" \
            --target "$release_target" --draft \
            --title "AliançaDX Acesso Remoto 6.3.0" \
            --notes-file "$RUNNER_TEMP/aliancadx-release-notes.md"
          release_id=$(gh api "repos/$GH_REPO/releases?per_page=100" --jq '[.[] | select(.tag_name == "v6.3.0")] | if length == 1 then .[0].id else error("Expected exactly one draft release") end')
          [[ "$release_id" =~ ^[0-9]+$ ]]
          gh api "repos/$GH_REPO/releases/$release_id" > "$RUNNER_TEMP/aliancadx-uploaded-release.json"
          python3 scripts/build_release.py \
            --output-dir "$RUNNER_TEMP/aliancadx-release" \
            --verify-upload "$RUNNER_TEMP/aliancadx-uploaded-release.json" \
            --expected-target "$release_target"
          # Publishing the draft creates its tag at the current default-branch
          # metadata commit. Do not create/fetch a tag before publication.
          test "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)" = "$release_target"
          gh api --method PATCH "repos/$GH_REPO/releases/$release_id" \
            -f "target_commitish=$release_target" -F draft=false > "$RUNNER_TEMP/aliancadx-published-release.json"
          python3 scripts/build_release.py \
            --output-dir "$RUNNER_TEMP/aliancadx-release" \
            --verify-upload "$RUNNER_TEMP/aliancadx-published-release.json" \
            --expected-target "$release_target" --published
          test "$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq .object.sha)" = "$release_target"
