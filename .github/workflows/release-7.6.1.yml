name: Publicar todos os aplicativos 7.6.1

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-7.6.1.yml
      - docs/APK_ANDROID_7_6_1.json
      - desktop/tests/windows_identity_smoke.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aliancadx-unified-release-7.6.1
  cancel-in-progress: false

jobs:
  # Real Shell and Tk checks must pass before any build or public upload.
  windows-native-identity:
    name: Conferir identidade e ícones nas APIs reais do Windows
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Obter os mesmos fontes da publicação
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Preparar Python oficial com Tcl/Tk
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Conferir AppID, atalhos e ícones nativos
        run: python desktop/tests/windows_identity_smoke.py

  build-audit-release:
    needs: windows-native-identity
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Obter exatamente os fontes congelados
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Conferir as barreiras de integridade e a PWA
        run: |
          python3 -m unittest discover -s scripts -p 'test_release_*.py' -v
          python3 -m unittest discover -s scripts -p 'test_mobile_release.py' -v
          python3 -m unittest discover -s scripts -p 'test_unified_release*.py' -v
          python3 -m unittest discover -s android/tests -p 'test_apk_payload.py' -v
          node --test ios-pwa/tests/*.test.mjs
      - name: Preparar ferramentas oficiais Android de verificação
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -x "$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -f "$sdk_root/build-tools/35.0.0/lib/apksigner.jar" ]]; then
            "$sdk_root/cmdline-tools/latest/bin/sdkmanager" 'build-tools;35.0.0' >/dev/null
          fi
          test -f "$sdk_root/build-tools/35.0.0/lib/apksigner.jar"
          echo "RELEASE_ANDROID_TOOLS=$sdk_root/build-tools/35.0.0" >> "$GITHUB_ENV"
          echo "RELEASE_JAVA=$JAVA_HOME_17_X64/bin/java" >> "$GITHUB_ENV"
      - name: Obter a base Windows histórica e fixada pelo GitHub
        run: |
          python3 scripts/github_release_inputs.py --controller --output "$RUNNER_TEMP/aliancadx-inputs"
      - name: Construir Windows, auditar Android assinado e conferir a PWA compartilhada
        run: |
          python3 scripts/unified_release_7_6_1.py \
            --input-dir "$RUNNER_TEMP/aliancadx-inputs" \
            --tools-dir "$RUNNER_TEMP/aliancadx-tools" \
            --output-dir "$RUNNER_TEMP/aliancadx-release" \
            --build-tools "$RELEASE_ANDROID_TOOLS" --java "$RELEASE_JAVA"
      - name: Guardar relatórios públicos da compilação e assinatura
        uses: actions/upload-artifact@v4
        with:
          name: aliancadx-7.6.1-verification
          path: |
            ${{ runner.temp }}/aliancadx-release/*.json
            ${{ runner.temp }}/aliancadx-release/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publicar o conjunto completo somente após verificar cada upload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          release_tag='v7.6.1'
          if gh release view "$release_tag" >/dev/null 2>&1; then
            echo 'O release já existe; nenhum arquivo publicado será sobrescrito.'
            exit 1
          fi
          existing_tag=$(git ls-remote --tags origin "refs/tags/$release_tag")
          test -z "$existing_tag"
          test "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=normal)"
          cat > "$RUNNER_TEMP/aliancadx-release-notes.md" <<'NOTES'
          AliançaDX Acesso Remoto 7.6.1 para Windows, Android e iPhone/iPad PWA.

          - Hospedeiro e Controlador Windows reconstruídos com os fontes desta revisão.
          - APK Android assinado pelo mantenedor e verificado novamente com as ferramentas oficiais.
          - PWA para iPhone/iPad com os mesmos arquivos de navegador incorporados nos dois instaladores.
          - Conexões salvas para facilitar novos acessos, com autorização no PC em cada sessão.
          - Atualização pelo próprio aplicativo, com download interno verificado e instalação no mesmo aplicativo; confirmações do sistema continuam disponíveis quando exigidas.
          - A tela remota ocupa a área disponível no celular, no navegador e no PC, inclusive quando a conexão reduz a resolução recebida.
          - Ícone AliançaDX nas janelas, nos atalhos e na barra de tarefas do Windows, com identidade própria por aplicativo.
          - Texto sem perdas por PNG quando esse formato é eficiente, com JPEG adaptativo para imagens complexas e compatibilidade com clientes anteriores.
          - Preferências e conexões salvas preservadas; atualização iniciada pela pessoa e aplicada quando as conexões estiverem encerradas.
          - Qualidade e fluidez ajustadas à conexão, com proteção contra filas de imagens antigas.
          - Mais nitidez no texto e controles móveis preservados.
          - APK assinado e base Windows obtidos exclusivamente de entradas públicas e imutáveis do GitHub, sem Drive.

          Cada sessão continua exigindo autorização no PC. O iPhone/iPad usa a PWA e o Conector Windows. Os EXEs mantêm o modelo de distribuição sem assinatura Authenticode; uma assinatura Android válida não constitui aprovação do Play Protect.

          Os relatórios e a lista SHA256SUMS acompanham todos os arquivos. Os instaladores passaram por CRC completo, metadados PE x64 e conferência dos fontes extraídos. O APK foi conferido por tamanho, SHA-256, certificados, linhagem e verificações oficiais para os intervalos Android suportados. Não se declara homologação em dispositivos físicos ou ausência de avisos de reputação.
          NOTES
          assets=("$RUNNER_TEMP/aliancadx-release/"*)
          gh release create "$release_tag" "${assets[@]}" --target "$GITHUB_SHA" --draft \
            --title 'AliançaDX Acesso Remoto 7.6.1' \
            --notes-file "$RUNNER_TEMP/aliancadx-release-notes.md"
          release_id=$(gh api "repos/$GH_REPO/releases?per_page=100" --jq '[.[] | select(.tag_name == "v7.6.1")] | if length == 1 then .[0].id else error("Expected exactly one draft release") end')
          [[ "$release_id" =~ ^[0-9]+$ ]]
          gh api "repos/$GH_REPO/releases/$release_id" > "$RUNNER_TEMP/aliancadx-uploaded-release.json"
          python3 scripts/unified_release_7_6_1.py --output-dir "$RUNNER_TEMP/aliancadx-release" \
            --verify-upload "$RUNNER_TEMP/aliancadx-uploaded-release.json" --expected-target "$GITHUB_SHA"
          # Keep main fixed until the complete draft has passed every asset check.
          test "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=normal)"
          gh api --method PATCH "repos/$GH_REPO/releases/$release_id" \
            -f "target_commitish=$GITHUB_SHA" -F draft=false > "$RUNNER_TEMP/aliancadx-published-release.json"
          python3 scripts/unified_release_7_6_1.py --output-dir "$RUNNER_TEMP/aliancadx-release" \
            --verify-upload "$RUNNER_TEMP/aliancadx-published-release.json" --expected-target "$GITHUB_SHA" --published
          test "$(gh api "repos/$GH_REPO/git/ref/tags/$release_tag" --jq .object.sha)" = "$GITHUB_SHA"
