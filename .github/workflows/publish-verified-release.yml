name: Liberar aplicativos verificados 6.2.1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-verified-draft:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Conferir e publicar os oito arquivos já verificados
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          source=93ac60b50fb3d2bafcee4088e75eb5881a7b2d8a
          target=$GITHUB_SHA
          tag=v6.2.1
          gh api "repos/$GH_REPO/releases/421302639" > "$RUNNER_TEMP/release-before.json"
          python3 scripts/check_release_6_2_1.py "$RUNNER_TEMP/release-before.json"
          test "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)" = "$target"
          # Only publication automation may differ from the verified build metadata commit.
          git diff --exit-code "$source" "$target" -- . \
            ':(exclude).github/workflows/release.yml' \
            ':(exclude).github/workflows/publish-verified-release.yml' \
            ':(exclude)scripts/check_release_6_2_1.py' \
            ':(exclude)scripts/release_6_2_1_recovery.json'
          remote_tag=$(git ls-remote --tags origin "refs/tags/$tag" | cut -f1)
          if [[ -n "$remote_tag" ]]; then
            test "$remote_tag" = "$target"
          fi
          python3 -c 'import json,os; from pathlib import Path; root=Path(os.environ["RUNNER_TEMP"]); release=json.loads((root/"release-before.json").read_text()); (root/"release-notes.txt").write_text(release["body"]+"\nProveniência: fontes dos aplicativos 265c358dc81d6a35a041fd2f79e2569adca6b36e; metadados do build 93ac60b50fb3d2bafcee4088e75eb5881a7b2d8a; publicação "+os.environ["GITHUB_SHA"]+". As diferenças do commit de publicação são restritas à automação de publicação.\n")'
          gh api --method PATCH "repos/$GH_REPO/releases/421302639" -f "target_commitish=$target" -F draft=false -F "body=@$RUNNER_TEMP/release-notes.txt" > "$RUNNER_TEMP/publish-response.json"
          gh api "repos/$GH_REPO/releases/421302639" > "$RUNNER_TEMP/release-after.json"
          python3 scripts/check_release_6_2_1.py "$RUNNER_TEMP/release-after.json" --published --published-target "$target"
          test "$(git ls-remote --tags origin "refs/tags/$tag" | cut -f1)" = "$target"
