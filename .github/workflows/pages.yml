name: Publicar GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - assets/**
      - scripts/check_site.py
      - scripts/package_site.py
      - scripts/test_install_assistant.cjs
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - name: Obter fontes
        uses: actions/checkout@v6
      - name: Validar e preparar página
        run: |
          python3 scripts/check_site.py
          node --check assets/install-assistant.js
          node --test scripts/test_install_assistant.cjs
          python3 scripts/package_site.py
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Guardar artefato público
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
